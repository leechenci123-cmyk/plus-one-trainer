name: beta-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.424'
      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Offline tests
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "artifacts/package/Plus-One-Trainer-$env:RELEASE_VERSION-win-x86.zip" `
            "artifacts/package/Plus-One-Trainer-$env:RELEASE_VERSION-win-x86.zip.sha256" `
            --title "+1 修改器 1.0 Beta 2" `
            --notes-file docs/RELEASE_NOTES_1.0_BETA.md `
            --prerelease `
            --verify-tag
